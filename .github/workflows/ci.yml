name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    # Hub/agent code touches Windows-only APIs (ctypes.windll), so test on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run pytest -q
      - run: uv run ruff check .

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Read version name
        id: version
        run: echo "name=$(grep -m1 'versionName' app/build.gradle.kts | grep -oP '"[^"]*"' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "personal-automations-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-automations-${{ steps.version.outputs.name }}.apk
          path: android/personal-automations-${{ steps.version.outputs.name }}.apk
