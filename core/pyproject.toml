[project]
name = "pa-core"
version = "0.1.0"
description = "Shared models and safe subprocess runner for Personal Automations"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "cryptography>=43", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa_core"]
