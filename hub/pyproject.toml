[project]
name = "pa-hub"
version = "0.1.0"
description = "Personal Automations hub (runs on the Windows PC)"
requires-python = ">=3.11"
dependencies = [
    "pa-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psutil>=6",
    "qrcode>=7",
]

[project.scripts]
pa-hub = "pa_hub.cli:main"

[tool.uv.sources]
pa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa_hub"]
