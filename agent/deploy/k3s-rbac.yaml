apiVersion: v1
kind: ServiceAccount
metadata:
  name: pa-agent
  namespace: lab
---
apiVersion: v1
kind: Secret
metadata:
  name: pa-agent-token
  namespace: lab
  annotations:
    kubernetes.io/service-account.name: pa-agent
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pa-agent
  namespace: lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pa-agent
  namespace: lab
subjects:
  - kind: ServiceAccount
    name: pa-agent
    namespace: lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pa-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pa-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pa-agent-read
subjects:
  - kind: ServiceAccount
    name: pa-agent
    namespace: lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pa-agent-read
