[project]
name = "pa-agent"
version = "0.1.0"
description = "Per-device Personal Automations agent"
requires-python = ">=3.11"
dependencies = ["pa-core", "fastapi>=0.115", "uvicorn[standard]>=0.30", "psutil>=6"]

[project.scripts]
pa-agent = "pa_agent.app:main"

[tool.uv.sources]
pa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa_agent"]
