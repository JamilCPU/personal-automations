[project]
name = "personal-automations"
version = "0.1.0"
description = "Personal Automations workspace root"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["core", "agent", "hub", "mcp"]

[tool.uv.sources]
pa-core = { workspace = true }
pa-agent = { workspace = true }
pa-hub = { workspace = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "pa-core", "pa-agent", "pa-hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["core", "agent", "hub"]

[tool.ruff]
line-length = 100
target-version = "py311"
